[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblemaps-shiba-api"
version = "1.0.0"
description = "FastAPI service exposing SHIBA transfers stored in ClickHouse"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect==0.8.18",
  "fastapi==0.115.12",
  "pydantic-settings==2.8.1",
  "uvicorn[standard]==0.34.0",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = [".deps", ".venv", "terraform/.terraform"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
